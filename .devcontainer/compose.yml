---
name: real-time-com_grafana-dashboards
services:
  vscode:
    container_name: grafana_vscode
    command: sleep infinity

    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        UV_VERSION: latest
        DEBIAN_VERSION: bookworm

    volumes:
      - ..:/workspace:cached

    environment:
      TZ: ${TZ:-America/Chicago}
